name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: typecheck, docs and secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck the examples
        run: npm run typecheck

      - name: Docs stay consistent with the contract
        run: npm run check:docs

      - name: No secrets in the working tree or the history
        run: npm run scan:secrets
